name: Publish stable release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select SDK supporting current Metal capabilities
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import glob, re, subprocess
          candidates = glob.glob('/Applications/Xcode_26*.app/Contents/Developer')
          if not candidates:
              raise SystemExit('Xcode 26 or newer is required for current Metal capability checks')
          selected = max(candidates, key=lambda p: tuple(map(int, re.findall(r'\d+', p))))
          subprocess.run(['sudo', 'xcode-select', '-s', selected], check=True)
          PYCODE
      - name: Validate version, sources, universal bundle and Ed25519 signature
        shell: bash
        run: |
          set -euo pipefail
          version="$(plutil -extract CFBundleShortVersionString raw Info.plist)"
          test "$GITHUB_REF_NAME" = "v$version"
          bash scripts/test.sh
          python3 scripts/validate-release.py
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(plutil -extract CFBundleShortVersionString raw Info.plist)"
          gh release create "$GITHUB_REF_NAME" \
            "dist/BatteryScope-${version}-universal.dmg" \
            dist/BatteryScope-stable.dmg \
            dist/BatteryScope-mobile-sources.tar \
            --verify-tag --title "BatteryScope ${version}" \
            --notes-file updates/release-notes.md --latest
